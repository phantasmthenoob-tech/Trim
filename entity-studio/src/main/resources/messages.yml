# Entity Studio message strings (MiniMessage). Prefix is prepended automatically.
prefix: "<dark_gray>[<gradient:#22d3ee:#a78bfa>Entity Studio</gradient>]</dark_gray> "
locked: "<red>Entity Studio is locked. An operator must run <yellow>/entity start</yellow><red> first."
no-permission: "<red>You don't have permission to do that."
players-only: "<red>Only players can use the editor GUI."
not-owner: "<red>Only the configured owner (<yellow><owner></yellow><red>) can do that."
activated: "<green>Entity Studio activated — editor commands are now enabled for operators."
already-active: "<yellow>Entity Studio is already active."
owner-bypass: "<gray>Owner override active for '<yellow><owner></yellow><gray>'."
session-invalid: "<red>That entity is no longer available. Session closed."
concurrent-editor: "<red>Another admin (<yellow><editor></yellow><red>) is already editing that entity."
entity-protected: "<red>That entity is protected and cannot be edited."
player-protected: "<red>You cannot edit other players without <yellow>entitystudio.player.edit</yellow>."
confirm-title: "Confirm destructive action"
type-cancel-hint: "<gray>Type the value in chat, or <red>cancel</red><gray>."
undo-empty: "<gray>Nothing to undo."
undo-done: "<green>Undid: <white><label></white>"
undo-irreversible: "<red>That operation cannot be undone (<white><label></white><red>)."
snapshot-saved: "<green>Snapshot '<white><name></white><green>' saved."
preset-applied: "<green>Preset '<white><name></white><green>' applied (<white><changed></white> fields changed)."
