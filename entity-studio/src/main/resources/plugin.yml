name: EntityStudio
version: '${version}'
main: com.entitystudio.EntityStudioPlugin
api-version: '1.21'
description: Visual entity editor for Minecraft Java 1.21 ( Paper plugin).
authors: [EntityStudio]
website: https://github.com/phantasmthenoob-tech/Trim

commands:
  # NOTE: no blanket `permission:` here on purpose. Bukkit would enforce it
  # before our code runs and lock out the configured owner (who may lack op).
  # The activation gate (locked plugin + owner override) and every subcommand's
  # own node check in StudioCommand are the single enforcement point.
  entitystudio:
    description: Entity Studio administration and editor entry points.
    usage: /entitystudio [inspect|edit|undo|presets|snapshot|reload|version|start|menu|morph|unmorph]
    aliases: [es, estudio]
  entity:
    description: Short alias for Entity Studio (activation + editor entry).
    usage: /entity [start|inspect|edit|undo|presets|snapshot|reload|version|menu|morph|unmorph]
  morph:
    description: Open the become-the-mob picker.
    usage: /morph [uuid]

permissions:
  entitystudio.use:
    description: Open the editor.
    default: op
  entitystudio.inspect:
    description: Inspect entity properties.
    default: op
  entitystudio.inventory.view:
    description: View inventories.
    default: op
  entitystudio.inventory.edit:
    description: Edit inventories.
    default: op
  entitystudio.data.view:
    description: View advanced data.
    default: op
  entitystudio.data.edit:
    description: Modify supported data.
    default: op
  entitystudio.behavior:
    description: Edit AI and behavior.
    default: op
  entitystudio.allegiance:
    description: Edit ownership and targeting.
    default: op
  entitystudio.trades:
    description: Edit merchant offers.
    default: op
  entitystudio.snapshot:
    description: Create and restore snapshots.
    default: op
  entitystudio.morph:
    description: Morph into mobs and use their abilities.
    default: op
  entitystudio.undo:
    description: Undo eligible edits.
    default: op
  entitystudio.presets:
    description: Create and apply presets.
    default: op
  entitystudio.player.edit:
    description: Edit other players.
    default: op
  entitystudio.admin:
    description: Administrative controls (reload, activation state).
    default: op
    children:
      entitystudio.use: true
      entitystudio.inspect: true
      entitystudio.inventory.view: true
      entitystudio.inventory.edit: true
      entitystudio.data.view: true
      entitystudio.data.edit: true
      entitystudio.behavior: true
      entitystudio.allegiance: true
      entitystudio.trades: true
      entitystudio.snapshot: true
      entitystudio.undo: true
      entitystudio.presets: true
      entitystudio.player.edit: true
      entitystudio.morph: true
