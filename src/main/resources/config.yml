###############################################################################
# MineTranslate - Google Translate for Minecraft (Paper 1.21.x)
#
# No API key needed. Translations use Google's free translate endpoint
# (translate.googleapis.com, client=gtx) directly from your server.
# If your host blocks outbound HTTP, translations will fail - check console.
###############################################################################

# Server default target language (used for /translate when only text given,
# and as fallback for players who never ran /mylang).
default-language: en

# When true, players with no saved language auto-translate into this language
# as soon as they run "/trchat on". When false they must pick one first.
default-auto-translate: false

# Max characters per single translation request. Longer text is split into
# chunks of this size so Google never rejects it. 1500 is safe.
max-text-length: 1500

# How many finished translations to keep in memory (per server, LRU).
cache-size: 500

# How long a cached translation stays valid (minutes). 0 = forever (until restart).
cache-expire-minutes: 60

# HTTP timeout per translation attempt (seconds).
request-timeout-seconds: 10

# Chat auto-translation behaviour for players who enabled /trchat:
chat:
  # Per-player translated delivery: players with auto-translate ON only see
  # the translated message (original hidden from them, with original shown
  # on hover). Everyone else sees the normal message.
  # If your chat plugin conflicts, set this to "copy" so translators get an
  # EXTRA translated line after the original instead.
  mode: per-viewer # per-viewer | copy
  # Prefix shown before translated chat, supports MiniMessage.
  prefix: "<gray>[<aqua><source>➜<target></aqua>]</gray> "
  # Show the original message on hover for translated chat.
  hover-original: true
  # Never auto-translate messages that start with these prefixes (commands
  # shown in chat, private-message formatting, etc).
  ignore-prefixes:
    - "/"
    - "[Staff]"
  # Maximum chat message length to auto-translate (longer = sent untranslated).
  max-length: 500

# Translations of signs (/trsign) and books (/trbook).
signs:
  # How far away (blocks) a sign can be targeted.
  max-distance: 6
books:
  # Maximum pages translated per /trbook run.
  max-pages: 50

messages:
  prefix: "<dark_gray>[<gradient:#4ade80:#22d3ee>MineTranslate</gradient>]</dark_gray> "
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this command."
  unknown-language: "<red>Unknown language '<input>'. Try /languages <input>"
  translated-header: "<gray>Translated <aqua><source></aqua> ➜ <green><target></green>:</gray>"
  usage-translate: "<yellow>Usage: /translate <target> <text...>  (e.g. /translate es Hello world)"
  usage-mylang: "<yellow>Usage: /mylang <language>  (e.g. /mylang es)"
  usage-trchat: "<yellow>Usage: /trchat <language|off|status>"
  usage-trsign: "<yellow>Usage: look at a sign, then /trsign <target> [--apply]"
  usage-trbook: "<yellow>Usage: hold a written book, then /trbook <target> [--copy]"
  translating: "<gray>Translating…"
  reloaded: "<green>MineTranslate configuration reloaded."
