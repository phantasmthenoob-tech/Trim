name: MineTranslate
version: '${version}'
main: com.minetranslate.MineTranslatePlugin
api-version: '1.21'
description: Google Translate in Minecraft - translate chat, signs and books.
authors: [MineTranslate]
website: https://github.com/phantasmthenoob-tech/Trim

commands:
  translate:
    description: Translate text with Google Translate.
    usage: /translate <target> <text...> OR /translate <source> <target> <text...> OR /translate <source>><target> <text...>
    aliases: [tr, t]
    permission: minetranslate.use
  mylang:
    description: Set your own translation language.
    usage: /mylang <language> | /mylang
    aliases: [setlang, tlang]
    permission: minetranslate.setlang
  trchat:
    description: Auto-translate incoming chat into your language.
    usage: /trchat <language|off|status>
    aliases: [autotranslate, trtoggle]
    permission: minetranslate.auto
  languages:
    description: List supported translation languages.
    usage: /languages [search]
    aliases: [langs, langlist]
    permission: minetranslate.list
  trsign:
    description: Translate the sign you are looking at.
    usage: /trsign <target> [--apply]
    aliases: [signtranslate]
    permission: minetranslate.sign
  trbook:
    description: Translate the written book in your hand.
    usage: /trbook <target> [--copy]
    aliases: [booktranslate]
    permission: minetranslate.book
  trgui:
    description: Open the MineTranslate GUI.
    usage: /trgui
    aliases: [translategui, trmenu]
    permission: minetranslate.use
  translate-reload:
    description: Reload the MineTranslate configuration.
    usage: /translate-reload
    aliases: [trreload]
    permission: minetranslate.admin

permissions:
  minetranslate.use:
    description: Use /translate.
    default: true
  minetranslate.setlang:
    description: Set own language with /mylang.
    default: true
  minetranslate.auto:
    description: Toggle chat auto-translation with /trchat.
    default: true
  minetranslate.list:
    description: List languages with /languages.
    default: true
  minetranslate.sign:
    description: Translate signs with /trsign.
    default: true
  minetranslate.book:
    description: Translate books with /trbook.
    default: true
  minetranslate.apply:
    description: Write translations back onto signs / books.
    default: op
  minetranslate.admin:
    description: Reload MineTranslate configuration.
    default: op
